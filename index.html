<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to CZECHINDO</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            background-color: #000000;
        }

        /* Background Foto Hitam Putih dengan Lapisan Gelap yang Diterangkan */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.5)), 
                        url('NZ6_7525.jpg') no-repeat center center;
            background-size: cover;
            filter: grayscale(100%) brightness(1.1) contrast(1.05);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 550px;
            text-align: center;
        }

        /* FRAME KOTAK BRAND */
        .brand-box {
            border: 4px solid #ffffff;
            padding: 15px 0;
            width: 340px;
            max-width: 100%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
        }

        .brand-title {
            font-family: 'Oswald', sans-serif;
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            line-height: 1;
            transition: opacity 0.4s ease, transform 0.4s ease;
            display: block;
            text-align: center;
            width: 100%;
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
        }

        .brand-title.fade-out {
            opacity: 0;
            transform: translateY(-8px);
        }

        .tagline {
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 25px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* ICON BULAT */
        .circle-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .circle-icon-item {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            color: #ffffff;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .circle-icon-item:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #ffffff;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .divider span {
            padding: 0 15px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* SECTION ARTICLES / BLOG OTOMATIS */
        .articles-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .article-card {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 18px 20px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .article-card:hover {
            border-color: #ffffff;
            background: rgba(0, 0, 0, 0.85);
            transform: translateY(-2px);
        }

        .article-tag {
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #aaaaaa;
            font-weight: 600;
        }

        .article-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            line-height: 1.3;
            text-transform: uppercase;
        }

        .article-desc {
            font-size: 0.78rem;
            color: #cccccc;
            line-height: 1.4;
            font-weight: 400;
        }

        .article-readmore {
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 6px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .loading-text {
            font-size: 0.85rem;
            color: #aaaaaa;
            text-align: center;
            padding: 20px 0;
            letter-spacing: 1px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-link {
            width: 100%;
            padding: 16px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-link i {
            font-size: 1.25rem;
            width: 24px;
            text-align: center;
            display: inline-block;
        }

        .btn-link:hover {
            background: #e0e0e0;
            transform: scale(1.02);
        }

        .btn-outline {
            background: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            border: 2px solid #ffffff;
            backdrop-filter: blur(4px);
        }

        .btn-outline:hover {
            background: #ffffff;
            color: #000000;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .input-field, .textarea-field {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            outline: none;
            transition: border-color 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .input-field::placeholder, .textarea-field::placeholder {
            color: #aaaaaa;
        }

        .input-field:focus, .textarea-field:focus {
            border-color: #ffffff;
            background: rgba(0, 0, 0, 0.85);
        }

        .textarea-field {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffffff;
            color: #ffffff;
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .btn-submit:hover {
            background: #ffffff;
            color: #000000;
        }

        footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #bbbbbb;
            letter-spacing: 1px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* IFRAME LAGU TERSEMBUNYI (BACKGROUND MUSIC) */
        .bg-music-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
            top: -9999px;
            left: -9999px;
        }
    </style>
</head>
<body>

    <!-- PEMUTAR LAGU TERSEMBUNYI (Lagu "Wilujeng": aAN_XvqwhQk) -->
    <div class="bg-music-player">
        <div id="youtube-audio-player"></div>
    </div>

    <div class="container">
        
        <!-- BRAND BOX DENGAN UKURAN KOTAK TERKUNCI -->
        <div class="brand-box">
            <h1 class="brand-title" id="brandTitle">CZECHINDO</h1>
        </div>

        <p class="tagline">LIVING LIFE BETWEEN CULTURES</p>

        <!-- KATEGORI ICON BULAT -->
        <div class="circle-icons">
            <div class="circle-icon-item" title="Vlog">
                <i class="fa-solid fa-video"></i>
            </div>
            <div class="circle-icon-item" title="Travel">
                <i class="fa-solid fa-plane"></i>
            </div>
            <div class="circle-icon-item" title="Culture">
                <i class="fa-solid fa-landmark"></i>
            </div>
        </div>

        <!-- Video Embed -->
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed?listType=playlist&list=UULFjR7ukWcVyLvPgqS5Tadq5A&autoplay=0&mute=0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>

        <!-- SECTION ARTIKEL OTOMATIS DARI MEDIUM -->
        <div class="divider">
            <span>LATEST ARTICLES</span>
        </div>

        <div class="articles-container" id="mediumArticles">
            <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> MEMUAT ARTIKEL MEDIUM...</div>
        </div>

        <div class="divider">
            <span>MY SOCIAL LINKS</span>
        </div>

        <div class="links-container">
            <a href="https://www.youtube.com/@risyadsyahrosyidi" target="_blank" class="btn-link">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>
            <a href="https://www.instagram.com/czechindo/" target="_blank" class="btn-link btn-outline">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            <a href="https://tiktok.com" target="_blank" class="btn-link">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>
            <a href="https://risyadrosyidi.medium.com/" target="_blank" class="btn-link btn-outline">
                <i class="fa-brands fa-medium"></i> Medium
            </a>
            <a href="https://yourportfolio.com" target="_blank" class="btn-link">
                <i class="fa-solid fa-briefcase"></i> Portfolio
            </a>
        </div>

        <div class="divider">
            <span>BUSINESS COLLABORATION</span>
        </div>

        <!-- FORMULIR KOLABORASI DENGAN TRIGGER EMAIL CLIENT (GMAIL) -->
        <form class="contact-form" id="collabForm" onsubmit="sendEmailClient(event)">
            <input type="text" class="input-field" id="clientName" name="Name_or_Company" placeholder="YOUR NAME / COMPANY" required>
            <input type="email" class="input-field" id="clientEmail" name="Email" placeholder="YOUR EMAIL ADDRESS" required>
            <textarea class="textarea-field" id="clientMessage" name="Message" placeholder="YOUR MESSAGE / PROPOSAL" required></textarea>
            <button type="submit" class="btn-submit">SEND MESSAGE</button>
        </form>

        <footer>
            &copy; 2026 Risyad Syah Rosyidi & Emma Rosyidi
        </footer>

    </div>

    <!-- YOUTUBE IFRAME API FOR AUTOMATIC AUDIO BACKGROUND -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- SCRIPT ANIMASI, MEDIUM RSS, AUTOPLAY MUSIK, & MAILTO POPUP -->
    <script>
        // 1. YouTube Background Audio Setup (Lagu: Wilujeng - aAN_XvqwhQk)
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-audio-player', {
                height: '0',
                width: '0',
                videoId: 'aAN_XvqwhQk',
                playerVars: {
                    'autoplay': 1,
                    'loop': 1,
                    'playlist': 'aAN_XvqwhQk',
                    'controls': 0
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
            
            const playAudioOnInteraction = () => {
                if (player && typeof player.playVideo === 'function') {
                    player.playVideo();
                }
                document.removeEventListener('click', playAudioOnInteraction);
                document.removeEventListener('touchstart', playAudioOnInteraction);
                document.removeEventListener('scroll', playAudioOnInteraction);
            };

            document.addEventListener('click', playAudioOnInteraction);
            document.addEventListener('touchstart', playAudioOnInteraction);
            document.addEventListener('scroll', playAudioOnInteraction);
        }

        // 2. Fungsi Mengarahkan Langsung ke Email (risyadrosyidi.cz@gmail.com) via mailto popup
        function sendEmailClient(event) {
            event.preventDefault(); // Mencegah reload halaman standar

            const name = document.getElementById('clientName').value;
            const email = document.getElementById('clientEmail').value;
            const message = document.getElementById('clientMessage').value;

            const recipient = "risyadrosyidi.cz@gmail.com";
            const subject = encodeURIComponent("Business Collaboration from " + name);
            const body = encodeURIComponent(
                "Name / Company: " + name + "\n" +
                "Email: " + email + "\n\n" +
                "Message / Proposal:\n" + message
            );

            // Membuka aplikasi email default / Gmail web client klien secara otomatis
            window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
        }

        // 3. Animasi Transisi Teks Header
        const words = ["CZECHINDO", "RISYAD", "EMMA"];
        let currentIndex = 0;
        const brandTitle = document.getElementById("brandTitle");

        setInterval(() => {
            brandTitle.classList.add("fade-out");
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % words.length;
                brandTitle.textContent = words[currentIndex];
                brandTitle.classList.remove("fade-out");
            }, 400);
        }, 2500);

        // 4. Fetch Otomatis Artikel dari Medium @risyadrosyidi via RSS to JSON
        async function fetchMediumArticles() {
            const container = document.getElementById('mediumArticles');
            const mediumUsername = 'risyadrosyidi';
            const rssUrl = `https://medium.com/feed/@${mediumUsername}`;
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    container.innerHTML = '';

                    const posts = data.items.slice(0, 3);

                    posts.forEach(post => {
                        const category = post.categories.length > 0 
                            ? post.categories[0].toUpperCase() 
                            : 'MEDIUM ARTICLE';

                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = post.description;
                        
                        let textContent = tempDiv.textContent || tempDiv.innerText || '';
                        if (textContent.length > 120) {
                            textContent = textContent.substring(0, 120) + '...';
                        }

                        const card = document.createElement('a');
                        card.className = 'article-card';
                        card.href = post.link;
                        card.target = '_blank';
                        card.rel = 'noopener noreferrer';

                        card.innerHTML = `
                            <span class="article-tag"><i class="fa-brands fa-medium"></i> ${category}</span>
                            <h2 class="article-title">${post.title}</h2>
                            <p class="article-desc">${textContent}</p>
                            <div class="article-readmore">BACA SELENGKAPNYA <i class="fa-solid fa-arrow-right"></i></div>
                        `;

                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<div class="loading-text">BELUM ADA ARTIKEL TERBIT DI MEDIUM</div>';
                }
            } catch (error) {
                console.error('Error loading Medium RSS:', error);
                container.innerHTML = `
                    <a href="https://risyadrosyidi.medium.com/" target="_blank" class="article-card">
                        <span class="article-tag"><i class="fa-brands fa-medium"></i> MEDIUM BLOG</span>
                        <h2 class="article-title">Kunjungi Profil Medium Risyad Rosyidi</h2>
                        <p class="article-desc">Klik di sini untuk membaca semua artikel dan cerita perjalanan terbaru langsung di Medium.</p>
                        <div class="article-readmore">BUKA MEDIUM <i class="fa-solid fa-arrow-right"></i></div>
                    </a>
                `;
            }
        }

        document.addEventListener("DOMContentLoaded", fetchMediumArticles);
    </script>

</body>
</html>
