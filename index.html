<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Saya</title>
    <style>
        :root {
            --bg-color: #ffffff; /* Putih terang bersih */
            --card-bg: #ffffff;  /* Putih murni tanpa shade abu */
            --text-primary: #111111;
            --text-secondary: #555555;
            --border-color: #e5e5e5;
            --accent-color: #0066ff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--card-bg);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); /* Shadow sangat tipis agar tetap terlihat terang */
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        h1, h2, h3 {
            color: var(--text-primary);
        }

        .card {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Judul Utama</h1>
        <p>Tampilan kini menggunakan warna putih murni yang lebih cerah dan tidak redup.</p>

        <div class="card">
            <h3>Kartu Informasi</h3>
            <p>Konten di dalam kartu dengan latar belakang putih terang.</p>
        </div>
    </div>

</body>
</html>
